resolution: workspace

version: 0.0.1

environment:
  flutter: ^3.41.0
  sdk: ^3.11.0

dependencies:
  collection: ^1.17.2 # allow newer versions, so it can compile with newer Flutter versions
  dart_mappable: ^4.8.0
  flutter:
    sdk: flutter
  flutter_foreground_task: ^9.2.2
  flutter_rust_bridge: ^2.12.0
  freezed_annotation: ^3.1.0
  gal: ^2.3.3
  logging: ^1.3.0
  mime: ^2.0.0
  path: ^1.9.1
  pool: ^1.5.2
  refena_flutter: ^3.5.0
  rust_lib_linko_app:
    path: rust_builder
  uuid: ^4.5.3

dev_dependencies:
  build_runner: any
  dart_mappable_builder: any
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  freezed: any
