name: linko_app
description: An open source cross-platform file sharing app
homepage: https://linko.app/
publish_to: "none"
resolution: workspace

version: 1.0.0+1

environment:
  flutter: ^3.41.0
  sdk: ^3.11.0

dependencies:
  collection: ^1.17.2 # allow newer versions, so it can compile with newer Flutter versions
  connectivity_plus: 7.3.1
  crypto: 3.0.7
  dart_mappable: any
  desktop_drop: 0.7.1
  device_apps: 2.2.0
  device_info_plus: 12.4.0
  dynamic_color: 1.8.1
  file_picker: 11.0.3
  file_selector: 1.1.0
  flex_color_picker: 3.8.0
  flutter:
    sdk: flutter
  flutter_displaymode: 0.7.0
  flutter_localizations:
    sdk: flutter
  flutter_markdown: 0.7.7+1
  freezed_annotation: 3.1.0
  glob: 2.1.3
  image: 4.9.1
  image_picker: 1.2.3
  in_app_purchase: 3.3.0
  intl: ^0.20.2 # allow newer versions, so it can compile with newer Flutter versions
  linko_isolates:
    path: ../packages/linko_isolates
  local_hero: ^0.3.0
  logging: 1.3.0
  meta: ^1.15.0 # allow newer versions, so it can compile with newer Flutter versions
  mime: 2.0.0
  nanoid2: 2.0.1
  network_info_plus: 7.0.0
  open_file: 4.0.0
  package_info_plus: 9.0.1
  pasteboard: 0.3.0
  path: 1.9.1
  path_provider: 2.1.6
  path_provider_foundation: 2.6.0
  permission_handler: 12.0.3
  pretty_qr_code: 3.6.0
  refena_flutter: 3.5.0
  screen_retriever: 0.2.2
  share_handler: 0.0.22
  shared_preferences: 2.5.5
  shared_preferences_platform_interface: any
  slang_flutter: ^4.19.0
  system_settings_2: 3.0.2
  tray_manager: 0.5.3
  uri_content: 3.1.1
  url_launcher: 6.3.2
  uuid: 4.6.0
  wakelock_plus: 1.5.2
  wechat_assets_picker: 10.1.3
  win32_registry: 2.1.0
  window_manager: 0.5.2
  windows_taskbar: 1.1.2

dev_dependencies:
  build_runner: 2.15.1
  dart_mappable_builder: any
  flutter_gen_runner: any
  flutter_lints: ^5.0.0
  freezed: any
  mockito: any
  slang: ^4.19.1
  test: any

flutter:
  uses-material-design: true

  assets:
    - assets/img/
    - assets/CHANGELOG.md

flutter_gen:
  line_length: 150
